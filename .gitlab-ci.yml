# Twice-weekly IMDb refresh, deployed to the Cloudflare Worker zac-movies (static assets, see wrangler.jsonc).
# Schedule it in GitLab: Build > Pipeline schedules > cron "0 4 * * 2,5", timezone Perth.
# Needs CI/CD variables CLOUDFLARE_API_TOKEN (masked) and CLOUDFLARE_ACCOUNT_ID.
# The token needs Account > Workers Scripts > Edit.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [build, deploy]

build:
  stage: build
  image: python:3.12-bookworm
  timeout: 45m
  # Keeps the New on streaming data between pipelines so code pushes don't spend API requests.
  cache:
    key: new-on-streaming
    paths: [cache/]
  script:
    - apt-get update -qq && apt-get install -y -qq nodejs >/dev/null && node --version
    - mkdir -p /tmp/imdb
    - |
      for f in title.basics title.ratings title.episode title.akas; do
        curl --fail --silent --show-error --location --retry 4 --retry-delay 15 \
          -A 'movie-finder-refresh/1.0' -o "/tmp/imdb/$f.tsv.gz" "https://datasets.imdbws.com/$f.tsv.gz"
      done
      ls -l /tmp/imdb
    - python tools/refresh_imdb.py --basics /tmp/imdb/title.basics.tsv.gz --ratings /tmp/imdb/title.ratings.tsv.gz
    - python tools/refresh_tv.py --basics /tmp/imdb/title.basics.tsv.gz --ratings /tmp/imdb/title.ratings.tsv.gz --episode /tmp/imdb/title.episode.tsv.gz
    - python tools/refresh_india.py --akas /tmp/imdb/title.akas.tsv.gz
    - python rebuild.py
    - python tools/check_refresh.py
    - node tests/verify_movie_finder.mjs
    - python research/build_tv.py --min-shows 1000
    - python tests/test_tv_pipeline.py
    - node tests/verify_tv_finder.mjs
    - python tools/build_foryou.py --require-tv
    # New on streaming (Streaming Availability API; needs CI/CD variable STREAMING_AVAILABILITY_API_KEY).
    # Scheduled and manual pipelines fetch fresh data; pushes reuse the cached copy if under 13 days old.
    - python tests/test_new_streaming.py
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] || [ "$CI_PIPELINE_SOURCE" = "web" ]; then FORCE=--force; else FORCE=; fi
      python tools/fetch_new_streaming.py $FORCE
    - python tools/build_new_streaming.py --ratings /tmp/imdb/title.ratings.tsv.gz
    # Top 20: Netflix's official AU Top 10 file + services' own top lists (Streaming Availability
    # /shows/top, same key, ~12 requests, cached like New) + optional TMDB_API_KEY + IMDb ratings.
    - python tests/test_top20.py
    - python tools/build_top20.py --basics /tmp/imdb/title.basics.tsv.gz --ratings /tmp/imdb/title.ratings.tsv.gz $FORCE
    - mkdir -p _site
    - cp Australian_Movies_Android.html _site/index.html
    - cp TV_Shows_Android.html _site/tv.html
    - cp ForYou_Android.html _site/foryou.html
    - cp New_Streaming_Android.html _site/new.html
    - cp Top20_Android.html _site/top20.html
    - cp -r site/. _site/
    - ls -l _site
  artifacts:
    paths: [_site/]
    expire_in: 1 week

deploy:
  stage: deploy
  image: node:22-bookworm-slim
  needs: [build]
  script:
    - npx --yes wrangler@4 deploy
