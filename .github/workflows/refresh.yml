name: Refresh IMDb data and publish site

on:
  schedule:
    # Twice a week: Monday and Thursday 20:00 UTC = Tuesday and Friday ~4:00 am Perth.
    - cron: '0 20 * * 1,4'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download IMDb official datasets and refresh ratings/votes
        run: python tools/refresh_imdb.py

      - name: Rebuild the app from snapshots
        run: python rebuild.py

      - name: Check refreshed catalogue
        run: python tools/check_refresh.py

      - name: Run functional checks
        run: node tests/verify_movie_finder.mjs

      - name: Prepare site
        run: |
          mkdir -p _site
          cp Australian_Movies_Android.html _site/index.html
          cp Australian_Movies_Android.html _site/Australian_Movies_Android.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
